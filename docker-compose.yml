services:
  db:
    image: postgres:18.6-alpine
    command: ["postgres", "-p", "5455"]
    environment:
      POSTGRES_DB: mundialito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5455:5455"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mundialito -p 5455"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/backend/Mundialito.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8081
      ConnectionStrings__PostgreSql: Host=db;Port=5455;Database=mundialito;Username=postgres;Password=postgres
      WebOrigin: http://localhost:3001
      InitializeDatabase: "true"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    environment:
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
    depends_on:
      - api

